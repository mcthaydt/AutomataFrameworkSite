# The journeys: the built site driven in real Chromium, WebKit and Firefox, one job per engine so a failing engine is
# named by its job. Called by `ci` (with the stand-in game) and by `site` (with the real game). Every action is pinned
# to a commit.
name: journeys

on:
  workflow_call:
    inputs:
      site-artifact:
        description: The name of the artifact, uploaded by the calling workflow, that holds the built site (dist/).
        type: string
        required: true
      latest:
        description: The folder of the ci-screens branch that gets this run's pictures as the latest (main, pr-12, live).
        type: string
        required: true

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the built site
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${{ inputs.site-artifact }}" --dir dist
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm test:journeys --project ${{ matrix.engine }}
      # Pictures a person looks at (the drunk-grandma check); nothing compares them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-${{ matrix.engine }}
          path: tests/journeys/__screenshots__/**
          if-no-files-found: ignore
      # What a failed journey leaves: Playwright's trace and the error's context for each, so a failure that does not
      # come again can still be read. Open a trace with `pnpm exec playwright show-trace <file>`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.engine }}
          path: test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # The same pictures, also as plain files on the `ci-screens` branch, because a cloud session can read the repository
  # through the GitHub API but is refused by the host that serves artifacts. Layout: `<commit>/<engine>/<name>.png`
  # for every run, plus `<latest>/<engine>/` for the newest run of that kind. A run of the real game keeps its
  # pictures apart from the stand-in game's (`-real`). Only this job may write, only to that branch (branch protection
  # covers `main`), and never for a pull request from a fork. In a called workflow `github` is the caller's, so this
  # runs for scheduled and hand-started runs too.
  screens:
    needs: engines
    if: always() && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    # One writer at a time, so two runs never race to push the branch.
    concurrency:
      group: ci-screens
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ format('{0}{1}', github.event.pull_request.head.sha || github.sha, (endsWith(inputs.latest, '-real') || inputs.latest == 'live') && '-real' || '') }}
      LATEST: ${{ inputs.latest }}
    steps:
      - name: Download this run's pictures
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'screens-*' --dir "$RUNNER_TEMP/screens" || true
      - name: Commit them to the ci-screens branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          engines=("$RUNNER_TEMP"/screens/screens-*)
          if [ ${#engines[@]} -eq 0 ]; then echo "This run made no pictures."; exit 0; fi
          git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The branch has no history in common with main; the first run starts it.
          if git fetch -q --depth 1 origin ci-screens; then git checkout -q -B ci-screens FETCH_HEAD; else git checkout -q --orphan ci-screens; fi
          for dir in "${engines[@]}"; do
            engine="${dir##*/screens-}"
            rm -rf "$LATEST/$engine"
            mkdir -p "$COMMIT/$engine" "$LATEST/$engine"
            find "$dir" -name '*.png' -exec cp {} "$COMMIT/$engine/" \; -exec cp {} "$LATEST/$engine/" \;
          done
          git add -A
          if git diff --cached --quiet; then echo "No new pictures."; exit 0; fi
          git commit -q -m "screens: $COMMIT ($LATEST)"
          git push -q origin ci-screens
          echo "Pictures: https://github.com/${GITHUB_REPOSITORY}/tree/ci-screens/$LATEST"
