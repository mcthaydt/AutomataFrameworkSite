# The journeys: the built site driven in real Chromium, WebKit and Firefox, each engine in two shards side by side (the
# Owner, 2026-11-15), and one `engines` check per engine so a failing engine is named by its check. Called by `ci` (with the stand-in game) and by `site` (with the real game). Every action is pinned
# to a commit.
name: journeys

on:
  workflow_call:
    inputs:
      site-artifact:
        description: The name of the artifact, uploaded by the calling workflow, that holds the built site (dist/).
        type: string
        required: true
      engines:
        description: The engines to play, as a JSON list. A draft of `ci` plays Chromium only; the rest pass as left out.
        type: string
        default: '["chromium", "webkit", "firefox"]'
      max-failures:
        description: Stop after this many failed journeys; 0 plays them all. A draft of `ci` stops at the first.
        type: number
        default: 0
      only-changed:
        description: Play only the journeys changed since `origin/main` (Playwright's `--only-changed`). A draft of `ci`
          that changed journeys and not the site asks for it.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shards:
    name: shards (${{ matrix.engine }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Playwright's own image for the version the lockfile pins: the browsers and the system libraries they need are
    # already in it, so nothing comes from the runner's package mirror, whose slow days left `install-deps` hanging
    # until the job's timeout. Pinned by digest; moving Playwright in the lockfile moves this tag and digest with it.
    # The runner's own user (1001), so the checkout, the caches and Firefox's home folder all belong to it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    permissions:
      actions: read
      contents: read
    strategy:
      # Stopping early (a draft) stops the other shards too; a whole run lets every shard finish.
      fail-fast: ${{ inputs.max-failures != 0 }}
      matrix:
        engine: ${{ fromJSON(inputs.engines) }}
        shard: [1, 2]
    env:
      ONLY: ${{ inputs.only-changed && '--only-changed=origin/main --pass-with-no-tests' || '' }}
    steps:
      # The whole history, so `--only-changed` can compare with `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image has no `gh`, so the built site comes through the artifact action.
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.site-artifact }}
          path: dist
      # The image's browsers fit only the Playwright they came with: say so plainly if the lockfile moves without it.
      - name: The image's Playwright is the lockfile's
        run: test "$(pnpm exec playwright --version)" = "Version 1.63.0"
      - run: pnpm test:journeys --project ${{ matrix.engine }} --shard=${{ matrix.shard }}/2 --max-failures=${{ inputs.max-failures }} $ONLY
      # Pictures a person looks at (the drunk-grandma check); nothing compares them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/journeys/__screenshots__/**
          if-no-files-found: ignore
      # What a failed journey leaves: Playwright's trace and the error's context for each, so a failure that does not
      # come again can still be read. Open a trace with `pnpm exec playwright show-trace <file>`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # One check per engine, `engines (<engine>)`, green only when both of that engine's shards passed, so the names
  # main's protection asks for stay as they were. An engine a draft left out passes and says so.
  engines:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      GH_TOKEN: ${{ github.token }}
      PLAYED: ${{ contains(fromJSON(inputs.engines), matrix.engine) }}
    steps:
      - name: Both shards of ${{ matrix.engine }} passed
        run: |
          set -euo pipefail
          if [ "$PLAYED" != true ]; then echo "${{ matrix.engine }} was left out of this draft's run."; exit 0; fi
          results="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs \
            --jq '.jobs[] | select(.name | test("shards \\(${{ matrix.engine }} ")) | "\(.name): \(.conclusion)"')"
          echo "$results"
          [ "$(grep -c ': success$' <<<"$results")" -eq 2 ]
