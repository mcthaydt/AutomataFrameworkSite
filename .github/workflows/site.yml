# The site, built around the newest commit of the demo game whose checks all passed, tested with that game in three
# real browsers, and then (only after the journeys pass, and only once the Owner has added the Cloudflare settings)
# uploaded to Cloudflare Pages and checked at its live address. It looks for a newer game every 10 minutes.
#
#   pick     asks GitHub which game commit passed, reads what the live site shows, and decides what this run does
#   build-real      builds the game with its own repo's `pnpm build`, then the site around it; the site's build opens
#                   the built game once in a browser for its picture (no secret is in the job)
#   journeys-real   the same journeys as `ci`, against the real game
#   deploy          the only job that holds the Cloudflare token; it never checks out or runs the game's code, and
#                   it runs only for `main`
#   live     waits for the live address to serve exactly this build, then runs the journeys against it
#
# The jobs that `ci` also has are named differently here (`build-real`, `journeys-real`), because GitHub matches a
# required check by its name alone and `main`'s required checks are `ci`'s.
#
# Every action is pinned to a commit.
name: site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  # Nothing sends this in M1. It costs one line and lets the game's repo ask for a new look later.
  repository_dispatch:
    types: [game-changed]

permissions:
  contents: read

# Never cancel a run that is part way through: it may be in the middle of a deploy.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: https://automataframework.pages.dev

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.pick.outputs.game }}
      build: ${{ steps.pick.outputs.build }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pick
        run: node scripts/pick-game.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A yes or no, never the token itself. Both settings must be there before the site is hosted.
          HOST_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}

  build-real:
    needs: pick
    if: needs.pick.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcthaydt/AutomataFrameworkExamples
          ref: ${{ needs.pick.outputs.game }}
          path: game
          persist-credentials: false
      # The job has two folders and no package.json at its root, so pnpm and Node are told where to look.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - name: The game and the site use the same pnpm
        run: |
          site_pnpm="$(node -p "require('./site/package.json').packageManager")"
          game_pnpm="$(node -p "require('./game/package.json').packageManager")"
          if [ "$site_pnpm" != "$game_pnpm" ]; then
            echo "The site uses $site_pnpm but the game uses $game_pnpm. Stop and tell the coordinator."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: |
            site/pnpm-lock.yaml
            game/pnpm-lock.yaml
      - name: Build the game with its own repo's build
        working-directory: game
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install the site
        working-directory: site
        run: pnpm install --frozen-lockfile
      # `pnpm build` opens the built site in Chromium once, for the game's picture, the share picture and the icon.
      - name: Install the browser the build takes its pictures with
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the site around the game
        working-directory: site
        run: pnpm build
        env:
          GAME_DIR: ../game/dist
          # Where the game's own files are (its project file, level, recorded play and licence): the page's facts.
          GAME_SOURCE: ../game
          GAME_COMMIT: ${{ needs.pick.outputs.game }}
          SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          if-no-files-found: error

  # The same journeys as `ci` runs, now against the real game. A called workflow gets no more than its caller grants.
  journeys-real:
    needs: build-real
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/journeys.yml
    with:
      site-artifact: site
      latest: ${{ github.event_name == 'pull_request' && format('pr-{0}-real', github.event.pull_request.number) || 'live' }}

  # Runs only when `pick` says so, and (with no status function in the condition) only after the journeys passed.
  # `pick` already says no off `main`; the ref is checked here too, so a hand-started run on a branch can never
  # reach the one job that holds the token, whatever `pick` printed.
  deploy:
    needs: [pick, journeys-real]
    if: needs.pick.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the built site
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name site --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload it to Cloudflare Pages
        run: |
          pnpm exec wrangler pages project create automataframework --production-branch main || echo "Creating the project failed or it already exists; the deploy step says which."
          pnpm exec wrangler pages deploy dist --project-name automataframework --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # Waits for the live address to serve exactly this build, then runs every journey against it in Chromium. The wait
  # comes first and alone, so the other journeys never judge a build Cloudflare has not switched to yet.
  live:
    needs: [pick, deploy]
    if: needs.pick.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      EXPECT_SITE: ${{ github.sha }}
      EXPECT_GAME: ${{ needs.pick.outputs.game }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the live address to serve this build
        # The file comes before `--project`, which would otherwise read it as a second project name.
        run: pnpm test:journeys tests/journeys/live.journey.ts --project chromium
        env:
          BASE_URL: ${{ env.SITE_URL }}
      - name: Run the other journeys against the live address
        run: pnpm test:journeys --project chromium --grep-invert "the live address"
        env:
          BASE_URL: ${{ env.SITE_URL }}
