# `plan` says how much this run tests. `check` runs the static checks and the Node tests. `build` makes the site around a
# stand-in game, and `journeys` drives it in real Chromium, WebKit and Firefox. Every action is pinned to a commit.
#
# How much is tested (the Owner, 2026-11-15): while a pull request is a draft, a thread is still working on it, so the
# Node tests run only where the change reaches, and the journeys play in Chromium only, only when the site's own files
# or the journeys changed, and stop at their first failure. The whole
# suite runs once the pull request is ready for review, on every push to main, and on a draft that carries the
# `full-tests` label.
name: ci

on:
  pull_request:
    # `ready_for_review` starts the whole suite as a draft is handed over; `labeled` lets a thread ask for it sooner.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push stops the run it replaces, so no one waits on results that no longer count.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  # Runs on main are never cancelled, so every merge gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # How much this run tests, from the event and the files the pull request changes. Everything but `docs` is `true`
  # except on a draft without the `full-tests` label whose change leaves the build and the test setup alone:
  #   full      false: the Node tests the change reaches (Vitest's `--changed`), the journeys in Chromium only, and
  #             every run stops at its first failure
  #   journeys  false when none of the files the site is made of, or its journeys, changed: the journeys are left out
  #   only      true when only journeys changed, not the site: just those play (Playwright's `--only-changed`), since
  #             a change to the site itself reaches every journey, which Playwright cannot trace through the built site
  #   docs      true when only Markdown that people read changed: `docs` passes every check main requires,
  #             under its own name, and every job that tests is left out
  #   quick     `quick ` on a draft, `skipped ` on a docs-only run, and empty otherwise: the start of every
  #             check's name, so a quick run never has the name of a check main requires, and only a full run (or
  #             `docs`) can let a pull request merge
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      journeys: ${{ steps.plan.outputs.journeys }}
      only: ${{ steps.plan.outputs.only }}
      docs: ${{ steps.plan.outputs.docs }}
      quick: ${{ steps.plan.outputs.docs == 'true' && 'skipped ' || steps.plan.outputs.full != 'true' && 'quick ' || '' }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          full=true journeys=true only=false docs=false
          if [ "$EVENT" = pull_request ] && [[ " $LABELS " != *" full-tests "* ]] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" && [ -n "$changed" ]; then
            printf 'This pull request changes:\n%s\n' "$changed"
            # Only Markdown that people read (CLAUDE.md and the notes under docs/, never the README or a page a test
            # reads): there is nothing to test, so `docs` passes every check main requires at once, draft or not.
            others="$(grep -vE '^(CLAUDE\.md|docs/.+\.md)$' <<<"$changed" || true)"
            if [ -z "$others" ]; then
              docs=true
            # A change to how things are installed, built or tested, or to the shared test files, reaches every test.
            elif [ "$DRAFT" = true ] && ! grep -qE '^(tests/fixtures/|package\.json|pnpm-lock\.yaml|[^/]*\.config\.(ts|js)|tsconfig[^/]*\.json|\.github/)' <<<"$changed"; then
              full=false
              grep -qE '^(src/|index\.html|404\.html|public/|scripts/|tests/journeys/)' <<<"$changed" || journeys=false
              grep -qE '^(src/|index\.html|404\.html|public/|scripts/)' <<<"$changed" || only=true
            fi
          fi
          # The `screenshots` label asks for the journeys, which take the pictures, on any draft.
          if [[ " $LABELS " == *" screenshots "* ]]; then journeys=true; fi
          echo "docs=$docs full=$full journeys=$journeys only=$only"
          { echo "docs=$docs"; echo "full=$full"; echo "journeys=$journeys"; echo "only=$only"; } >> "$GITHUB_OUTPUT"

  # A pull request that changes only Markdown that people read has nothing to test (the Owner, 2026-11-15). This job
  # stands in for every check main requires, under its exact name, and passes at once. Every job that tests is left out
  # and has `skipped ` at the start of its name, so a skipped job never wears a required name, and on any other run this
  # job's own names start with `docs only `.
  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    name: ${{ needs.plan.outputs.docs == 'true' && matrix.check || format('docs only {0}', matrix.check) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - 'check'
          - 'build'
          - 'journeys / engines (chromium)'
          - 'journeys / engines (webkit)'
          - 'journeys / engines (firefox)'
    env:
      CHECK: ${{ matrix.check }}
    steps:
      - run: echo "Only Markdown that people read changed, so there is nothing to test, and $CHECK passes."

  check:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}check
    runs-on: ubuntu-latest
    env:
      # On a draft: the Node tests the change reaches, stopping at the first failure.
      ONLY: ${{ needs.plan.outputs.full != 'true' && '--changed=origin/main --bail=1 --passWithNoTests' || '' }}
    steps:
      # The whole history, so `--changed` can compare with `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:node $ONLY

  # The site as it would be served, with the stand-in game, for the journeys to drive.
  build:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}build
    runs-on: ubuntu-latest
    # Playwright's own image for the version the lockfile pins: the browsers and the system libraries they need are
    # already in it, so nothing comes from the runner's package mirror, whose slow days left `install-deps` hanging
    # until the job's timeout. Pinned by digest; moving Playwright in the lockfile moves this tag and digest with it.
    # The runner's own user (1001), so the checkout, the caches and Firefox's home folder all belong to it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` opens the built site in Chromium once, for the game's picture, the share picture and the icon.
      # The image's browsers fit only the Playwright they came with: say so plainly if the lockfile moves without it.
      - name: The image's Playwright is the lockfile's
        run: test "$(pnpm exec playwright --version)" = "Version 1.63.0"
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          if-no-files-found: error

  # A called workflow gets no more than its caller grants: `actions: read` lets it download the site. Nothing may
  # write; the pictures are kept as each run's artifacts (the Owner, 2026-11-15: no ci-screens branch here).
  journeys:
    needs: [plan, build]
    name: ${{ needs.plan.outputs.quick }}journeys
    if: needs.plan.outputs.docs != 'true' && needs.plan.outputs.journeys == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/journeys.yml
    with:
      site-artifact: site
      engines: ${{ needs.plan.outputs.full == 'true' && '["chromium", "webkit", "firefox"]' || '["chromium"]' }}
      max-failures: ${{ needs.plan.outputs.full != 'true' && 1 || 0 }}
      only-changed: ${{ needs.plan.outputs.only == 'true' }}

  # The one aggregate check main requires beside the names above. `plan` decides which checks apply to this run; this
  # passes only when each of those ran and passed and every other was left out by `plan`, so a job skipped because
  # something before it failed or was cancelled never counts as passed. A draft's is `quick gate`, which main never
  # requires, so only a full run (or a docs-only one) can let a pull request merge. A new job is added to both lists.
  gate:
    needs: [plan, docs, check, build, journeys]
    if: always()
    name: ${{ needs.plan.outputs.quick == 'quick ' && 'quick ' || '' }}gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that applies ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          GATE: |
            const results = JSON.parse(process.env.RESULTS)
            const applies = JSON.parse(process.env.APPLIES)
            let ok = true
            for (const [job, want] of Object.entries(applies)) {
              const got = results[job]?.result
              const good = want ? got === 'success' : got === 'skipped'
              console.log(`${good ? 'ok ' : 'NO '} ${job}: ${want ? 'applies' : 'not applicable'}, ${got}`)
              ok &&= good
            }
            for (const job of Object.keys(results)) {
              if (!(job in applies)) {
                console.log(`NO  ${job}: the gate does not know this job`)
                ok = false
              }
            }
            process.exit(ok ? 0 : 1)
          APPLIES: >-
            {"plan": true, "docs": ${{ needs.plan.outputs.docs == 'true' }}, "check": ${{ needs.plan.outputs.docs != 'true' }}, "build": ${{ needs.plan.outputs.docs != 'true' }}, "journeys": ${{ needs.plan.outputs.docs != 'true' && needs.plan.outputs.journeys == 'true' }}}
        run: |
          node --input-type=module -e "$GATE"
        shell: bash
